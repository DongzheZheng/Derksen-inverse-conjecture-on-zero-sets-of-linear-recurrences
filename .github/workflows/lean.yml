name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and axiom check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: ArithDyn
          use-mathlib-cache: true
      - name: Check axiom dependencies
        run: python3 scripts/check_axioms.py
